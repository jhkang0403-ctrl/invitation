<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>강한승 생일 초대장</title>
  <style>
    body {
      margin: 0;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: #fff7ed;
      color: #3f2f2a;
      text-align: center;
    }

    .wrap {
      max-width: 430px;
      margin: 0 auto;
      padding: 44px 24px;
      min-height: 100vh;
      background: #fffaf5;
      box-sizing: border-box;
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: #ffe1c7;
      color: #7c3f20;
      font-size: 14px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 31px;
      line-height: 1.35;
      margin: 16px 0 20px;
      font-weight: 700;
    }

    .age {
      font-size: 20px;
      color: #d97706;
      margin-bottom: 28px;
      font-weight: 700;
    }

    .cake {
      font-size: 58px;
      margin: 20px 0;
    }

    .message {
      font-size: 17px;
      line-height: 1.8;
      margin: 30px 0;
    }

    .section {
      margin-top: 28px;
      padding: 22px 18px;
      border-radius: 18px;
      background: #ffffff;
      border: 1px solid #f1d7bf;
      box-shadow: 0 8px 20px rgba(120, 72, 36, 0.08);
    }

    .section h2 {
      font-size: 16px;
      margin: 0 0 12px;
      color: #a65420;
    }

    .info {
      font-size: 16px;
      line-height: 1.8;
    }

    .map-link {
      display: inline-block;
      margin-top: 16px;
      padding: 11px 18px;
      border-radius: 999px;
      background: #03c75a;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 6px 14px rgba(3, 199, 90, 0.22);
    }

    .menu {
      font-size: 16px;
      line-height: 1.8;
      font-weight: 600;
    }

    .footer {
      margin-top: 32px;
      font-size: 15px;
      line-height: 1.8;
      color: #6b4f43;
    }

    .heart {
      color: #ef4444;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="badge">Birthday Invitation</div>

    <div class="cake">🎂</div>

    <h1>
      강한승의<br />
      만 61세 생일파티에<br />
      초대합니다
    </h1>

    <div class="age">Happy 61st Birthday</div>

    <div class="message">
      아빠, 생일 축하드립니다.<br />
      건강하시고 오래오래 행복하세요
      <span class="heart">♥</span>
    </div>

    <section class="section">
      <h2>주인공</h2>
      <div class="info">강한승</div>
    </section>

    <section class="section">
      <h2>일시</h2>
      <div class="info">
        2026년 5월 23일 토요일<br />
        오후 12시
      </div>
    </section>

    <section class="section">
      <h2>장소</h2>
      <div class="info">
        마포생고기<br />
        경기도 수원시 팔달구 향교로 132-1
      </div>
      <a
        class="map-link"
        href="https://map.naver.com/p/search/마포생고기%20경기도%20수원시%20팔달구%20향교로%20132-1"
        target="_blank"
        rel="noopener noreferrer"
      >
        네이버 지도 보기
      </a>
    </section>

    <section class="section">
      <h2>메뉴</h2>
      <div class="menu">
        시작은 삼겹살<br />
        마무리는 소고기
      </div>
    </section>

    <section class="section">
      <h2>참석자</h2>
      <div class="info">
        강한승 · 조연수 · 강나형 · 강승우
      </div>
    </section>

    <div class="footer">
      함께 웃고 맛있게 먹는<br />
      따뜻한 생일 자리가 되었으면 합니다.
    </div>
  </main>
</body>
</html>
