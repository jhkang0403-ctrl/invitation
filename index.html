<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>초대합니다</title>
  <style>
    body {
      margin: 0;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: #f8f3ee;
      color: #3b2f2f;
      text-align: center;
    }

    .wrap {
      max-width: 430px;
      margin: 0 auto;
      padding: 48px 24px;
      min-height: 100vh;
      background: #fffaf6;
    }

    h1 {
      font-size: 34px;
      margin: 40px 0 16px;
      font-weight: 500;
    }

    .date {
      font-size: 18px;
      margin-bottom: 32px;
    }

    .names {
      font-size: 24px;
      margin: 32px 0;
      line-height: 1.8;
    }

    .message {
      font-size: 16px;
      line-height: 1.8;
      margin: 32px 0;
    }

    .place {
      margin-top: 40px;
      font-size: 15px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p>Birthday Invitation</p>

    <h1>초대합니다</h1>

    <div class="date">
      2026. 05. 23. 토요일 오후 12시
    </div>

    <div class="names">
      신랑 홍길동<br />
      신부 김영희
    </div>

    <div class="message">
      저희 두 사람이 사랑과 믿음으로<br />
      한 가정을 이루려 합니다.<br />
      소중한 걸음으로 축복해 주세요.
    </div>

    <div class="place">
      서울 웨딩홀 3층 그랜드홀<br />
      서울특별시 강남구 어딘가로 123
    </div>
  </main>
</body>
</html>
